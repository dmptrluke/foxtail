version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    time: '09:00'
    timezone: Pacific/Auckland
  open-pull-requests-limit: 100
  groups:
    npm-minor-patch:
      update-types:
        - minor
        - patch
    npm-security:
      applies-to: security-updates
      patterns:
        - '*'
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
    time: '09:00'
    timezone: Pacific/Auckland
  open-pull-requests-limit: 100
  groups:
    uv-minor-patch:
      update-types:
        - minor
        - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: '09:00'
    timezone: Pacific/Auckland
  open-pull-requests-limit: 100
  groups:
    actions-minor-patch:
      update-types:
        - minor
        - patch
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    time: '09:00'
    timezone: Pacific/Auckland
  open-pull-requests-limit: 100
  groups:
    docker-minor-patch:
      update-types:
        - minor
        - patch
- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: weekly
    time: '09:00'
    timezone: Pacific/Auckland
  open-pull-requests-limit: 100
  groups:
    pre-commit-minor-patch:
      update-types:
        - minor
        - patch
